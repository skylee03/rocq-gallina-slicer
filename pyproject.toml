[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocq-gallina-slicer"
version = "0.1.0"
description = "MetaRocq-based dependency slicing for a Gallina subset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "skylee03" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Compilers",
]

[project.scripts]
gallina-slice = "gallina_slicer.cli:main"

[tool.setuptools.packages.find]
include = ["gallina_slicer*"]
